name: Release

# Builds the port and publishes a GitHub release.
#
#  * Push a tag (`git tag v0.0.1 && git push origin v0.0.1`) to release exactly that version.
#  * Or run the workflow by hand: it bumps `[workspace.package] version` in Cargo.toml, commits
#    and pushes the bump, then builds and releases. Releases start at 0.0.1 and go up from the
#    latest tag (patch by default; choose minor or major, or type an exact version).
#
# The artifact is the Linux x86-64 desktop build. The Termux (Android arm64) binary needs
# Termux's own $PREFIX libraries, so it is built on the device with `bash build-termux.sh`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to release, e.g. 0.0.2 (empty: bump from the latest tag)"
        type: string
        default: ""
      bump:
        description: "Bump to apply when no exact version is given"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release (Linux x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="${INPUT_VERSION#v}"
            if [ -z "$VERSION" ]; then
              last="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
              last="${last#v}"
              last="${last:-0.0.0}"
              IFS=. read -r major minor patch <<< "$last"
              case "$INPUT_BUMP" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                *)     patch=$((patch + 1)) ;;
              esac
              VERSION="$major.$minor.$patch"
            fi
            TAG="v$VERSION"
            # The released binary should report the released version.
            sed -i -E '0,/^version = "[0-9]+\.[0-9]+\.[0-9]+"$/s//version = "'"$VERSION"'"/' Cargo.toml
            cargo update --workspace
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "Cargo.toml already at $VERSION; nothing to commit."
            else
              git commit -m "Release v$VERSION"
              if [ "$GITHUB_REF_TYPE" = "branch" ]; then
                git push origin "HEAD:$GITHUB_REF_NAME"
              else
                echo "Not on a branch; leaving the bump commit local." >&2
              fi
            fi
          fi
          sha="$(git rev-parse HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG from $sha"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgtk-3-dev libfontconfig1-dev libfreetype-dev

      - name: Build
        run: cargo build --release --locked -p wordcraft -p wordcraft-cli

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp target/release/wordcraft target/release/wordcraft-cli dist/
          cp README.md TERMUX.md dist/
          tar -czf "wordcraft-${VERSION}-linux-x86_64.tar.gz" -C dist .

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          asset="wordcraft-${VERSION}-linux-x86_64.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its asset."
            gh release upload "$TAG" "$asset" --clobber
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            gh release create "$TAG" "$asset" --title "WordCraft $TAG" --verify-tag --generate-notes
          else
            gh release create "$TAG" "$asset" --title "WordCraft $TAG" --target "$SHA" --generate-notes
          fi
