name: Build

# Debug build of the Termux app: compiles inside a real Termux (bionic, aarch64) container on
# GitHub's free arm64 runner and packages it as a .deb. The .deb is attached to the run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels its older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    name: Termux .deb (debug, aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Build in a Termux container
        run: |
          set -euo pipefail
          mkdir -p out
          chmod 777 out
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/out:/out" \
            -e CARGO_BUILD_JOBS=4 \
            -e WORDCRAFT_BUILD_SHA="$GITHUB_SHA" \
            -e CARGO_PROFILE_DEV_DEBUG=0 \
            termux/termux-docker:aarch64 \
            bash -lc '
              set -eu
              cp -a /src "$HOME/wordcraft"
              cd "$HOME/wordcraft"
              export DEBIAN_FRONTEND=noninteractive
              pkg update -y
              pkg install -y rust git
              bash build-termux.sh
              bash package-termux.sh
              cp dist/*.deb /out/
            '
      - uses: actions/upload-artifact@v5
        with:
          name: wordcraft-deb-debug
          path: out/*.deb
          if-no-files-found: error
          retention-days: 14
