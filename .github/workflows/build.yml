name: Build

# Debug build of the port on Linux x86-64: proves the workspace compiles and leaves a binary you
# can download from the run's Artifacts.
#
# This does not produce the Termux (Android arm64) binary: that needs Termux's own $PREFIX
# libraries, which no GitHub runner has. Build the Termux binary on the device with
# `bash build-termux.sh` (see TERMUX.md).
on:
  push:
    branches: [main, termux-port]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels its older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  debug:
    name: Debug (Linux x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: debug
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgtk-3-dev libfontconfig1-dev libfreetype-dev
      - name: Build
        run: cargo build -p wordcraft
      - name: Package
        run: |
          mkdir -p dist
          cp target/debug/wordcraft dist/
          cp README.md TERMUX.md dist/
          tar -czf wordcraft-debug-linux-x86_64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: wordcraft-debug-linux-x86_64
          path: wordcraft-debug-linux-x86_64.tar.gz
          retention-days: 14
