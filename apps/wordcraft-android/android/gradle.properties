# Low-RAM defaults: the tablet build must not invite Android's low-memory killer
# to reclaim Termux or the worktree. CI may override the JVM heap if it has more RAM.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
